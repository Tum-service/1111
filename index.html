<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌈 คลังคำศัพท์อังกฤษ · มีอีโมจิทุกคำ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=Itim&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Kanit', 'Itim', 'Segoe UI', sans-serif;
      font-weight: 500;
      background: #f9f3e8;
      min-height: 100vh;
      padding: 16px;
      color: #1e293b;
      position: relative;
      overflow-x: hidden;
    }

    /* ============================================================
       ANIMATED COLORFUL BACKGROUND
       ============================================================ */
    .bg-animated {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(120deg, #fde68a, #fbcfe8, #bfdbfe, #bbf7d0, #fed7aa, #fde68a);
      background-size: 400% 400%;
      animation: gradientFlow 16s ease infinite;
    }
    @keyframes gradientFlow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .bg-blobs {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-blobs .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.45;
      will-change: transform;
    }
    .bg-blobs .blob:nth-child(1) { width: 320px; height: 320px; background: #f9a8d4; top: -80px; left: -60px; animation: blobFloat1 14s ease-in-out infinite; }
    .bg-blobs .blob:nth-child(2) { width: 260px; height: 260px; background: #93c5fd; top: 40%; right: -80px; animation: blobFloat2 18s ease-in-out infinite; }
    .bg-blobs .blob:nth-child(3) { width: 300px; height: 300px; background: #fcd34d; bottom: -100px; left: 20%; animation: blobFloat3 16s ease-in-out infinite; }
    .bg-blobs .blob:nth-child(4) { width: 220px; height: 220px; background: #86efac; top: 10%; right: 20%; animation: blobFloat1 20s ease-in-out infinite reverse; }
    .bg-blobs .blob:nth-child(5) { width: 260px; height: 260px; background: #c4b5fd; bottom: 10%; right: 10%; animation: blobFloat2 15s ease-in-out infinite reverse; }
    @keyframes blobFloat1 {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(60px,80px) scale(1.15); }
    }
    @keyframes blobFloat2 {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(-70px,50px) scale(1.1); }
    }
    @keyframes blobFloat3 {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(50px,-60px) scale(1.2); }
    }
    .bg-floaters {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-floaters span {
      position: absolute;
      bottom: -60px;
      font-size: 22px;
      opacity: 0;
      animation-name: floatUp;
      animation-timing-function: ease-in;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.08));
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    .app { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

    .header {
      text-align: center;
      padding: 26px 24px 30px;
      background: linear-gradient(135deg, #f97316, #f59e0b, #fcd34d);
      background-size: 200% 200%;
      animation: headerGlow 10s ease infinite;
      border-radius: 40px 40px 40px 12px;
      box-shadow: 0 12px 30px rgba(245, 158, 11, 0.35);
      color: #1e293b;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }
    @keyframes headerGlow {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .header::after {
      content: "⭐";
      position: absolute;
      left: 18px;
      top: 10px;
      font-size: 40px;
      opacity: 0.25;
      transform: rotate(-15deg);
    }
    .header::before {
      content: "🎨";
      position: absolute;
      right: 18px;
      top: 10px;
      font-size: 40px;
      opacity: 0.25;
      transform: rotate(15deg);
    }
    .header-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 22px;
      flex-wrap: wrap;
    }
    .header-text { text-align: center; }
    .header h1 {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 3px 3px 0 rgba(255,255,255,0.35);
    }
    .header p {
      font-size: 21px;
      font-weight: 600;
      color: #3b2e1e;
      margin-top: 4px;
    }
    .header p.school-line {
      font-size: 19px;
      font-weight: 700;
      color: #7c2d12;
      margin-top: 2px;
    }
    .header .badge {
      display: inline-block;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(4px);
      padding: 8px 22px;
      border-radius: 50px;
      font-size: 15px;
      margin-top: 14px;
      font-weight: 700;
      color: #3b2e1e;
      border: 1px solid rgba(255,255,255,0.4);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      padding: 16px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid rgba(255,255,255,0.8);
    }
    .controls select {
      padding: 10px 18px;
      border: 2px solid #fbbf24;
      border-radius: 30px;
      font-size: 16px;
      background: white;
      font-family: inherit;
      color: #1e293b;
      outline: none;
      cursor: pointer;
      min-width: 140px;
    }
    .controls .search-wrap {
      flex: 1;
      min-width: 180px;
      position: relative;
    }
    .controls .search-wrap input {
      width: 100%;
      padding: 10px 16px 10px 44px;
      border: 2px solid #e2e8f0;
      border-radius: 30px;
      font-size: 16px;
      background: white;
      outline: none;
      font-family: inherit;
      transition: 0.2s;
    }
    .controls .search-wrap input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }
    .controls .search-wrap .icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: #94a3b8;
    }
    .controls .stats {
      font-size: 16px;
      color: #64748b;
      margin-left: auto;
      white-space: nowrap;
      background: #f1f5f9;
      padding: 6px 16px;
      border-radius: 30px;
    }
    .controls .stats strong {
      color: #f97316;
      font-size: 20px;
    }

    .grade-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .grade-tabs button {
      padding: 8px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 40px;
      background: white;
      font-size: 15px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .grade-tabs button:hover {
      transform: translateY(-2px);
      border-color: #fbbf24;
    }
    .grade-tabs button.active {
      background: #f59e0b;
      color: #1e293b;
      border-color: #f59e0b;
      box-shadow: 0 6px 14px rgba(245, 158, 11, 0.35);
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 16px 16px 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: #fcd34d;
      box-shadow: 0 16px 30px rgba(0,0,0,0.08);
    }
    .card:active { transform: scale(0.96); }

    /* ====== การ์ดคำศัพท์: วงกลมอีโมจิ ====== */
    .card .img-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1/1;
      padding: 4px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fef3c7, #fde68a, #fbcfe8, #bfdbfe);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card .img-frame::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220%;
      height: 220%;
      background: conic-gradient(from 0deg, #f97316, #fbbf24, #a3e635, #34d399, #22d3ee, #818cf8, #f472b6, #f97316);
      animation: spinBorder 5s linear infinite;
      transform: translate(-50%,-50%) rotate(0deg);
    }
    @keyframes spinBorder {
      to { transform: translate(-50%,-50%) rotate(360deg); }
    }
    .card .card-emoji {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #fffbeb;
      font-size: 62px;
      line-height: 1;
      user-select: none;
    }
    .card .en {
      font-size: 27px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.3;
    }
    .card .th {
      font-size: 17px;
      font-weight: 600;
      color: #475569;
      margin-top: 2px;
    }
    .card .pos {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      background: #f1f5f9;
      padding: 2px 14px;
      border-radius: 30px;
      margin-top: 6px;
      display: inline-block;
    }
    .card .speak-icon {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 18px;
      opacity: 0.3;
      transition: 0.2s;
      z-index: 2;
    }
    .card:hover .speak-icon { opacity: 0.8; }
    .card.speaking {
      border-color: #f97316;
      background: #fffbeb;
    }
    .card.speaking .speak-icon {
      opacity: 1;
      animation: pulse 0.8s infinite;
    }
    @keyframes pulse {
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.25)}
    }

    .card .mic-icon {
      position: absolute;
      top: 12px;
      left: 14px;
      font-size: 17px;
      z-index: 2;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: 0.2s;
      cursor: pointer;
    }
    .card:hover .mic-icon { opacity: 1; }
    .card .mic-icon:active { transform: scale(0.9); }
    .card.mic-listening .mic-icon {
      opacity: 1;
      background: #fee2e2;
      animation: micPulse 0.9s infinite;
    }
    @keyframes micPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }
    .card.mic-success { animation: cardGoodFlash 1s ease; }
    .card.mic-fail { animation: cardShake 0.45s ease; }
    @keyframes cardGoodFlash {
      0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
      60% { box-shadow: 0 0 0 14px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
    @keyframes cardShake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .sticker-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 30;
    }
    .sticker-pop {
      text-align: center;
      animation: stickerPop 1.7s ease forwards;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
    }
    .sticker-pop .sticker-emoji { font-size: 58px; display: block; }
    .sticker-pop .sticker-text {
      display: inline-block;
      margin-top: 2px;
      font-size: 16px;
      font-weight: 800;
      color: #15803d;
      background: white;
      padding: 3px 14px;
      border-radius: 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }
    .sticker-pop.big .sticker-emoji { font-size: 92px; }
    .sticker-pop.big .sticker-text { font-size: 20px; padding: 5px 20px; }
    @keyframes stickerPop {
      0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
      15%  { transform: scale(1.35) rotate(10deg); opacity: 1; }
      30%  { transform: scale(0.92) rotate(-6deg); }
      45%  { transform: scale(1.08) rotate(3deg); }
      60%  { transform: scale(1) rotate(0deg); }
      82%  { opacity: 1; }
      100% { opacity: 0; transform: scale(1) translateY(-14px); }
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.6);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white;
      border-radius: 40px;
      max-width: 720px;
      width: 100%;
      padding: 32px 28px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(40px) scale(0.94); }
      to { opacity:1; transform:translateY(0) scale(1); }
    }
    .modal .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 30px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 30px;
      transition: 0.2s;
      line-height: 1;
    }
    .modal .close-btn:hover {
      background: #f1f5f9;
      color: #1e293b;
    }
    .modal .modal-top {
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    /* ====== Modal: อีโมจิวงกลม ====== */
    .modal .modal-image-outer {
      position: relative;
      flex-shrink: 0;
    }
    .modal .modal-image-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      padding: 5px;
      border-radius: 32px;
      overflow: hidden;
      background: #fef3c7;
    }
    .modal .modal-image-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220%;
      height: 220%;
      background: conic-gradient(from 0deg, #f97316, #fbbf24, #a3e635, #34d399, #22d3ee, #818cf8, #f472b6, #f97316);
      animation: spinBorder 5s linear infinite;
      transform: translate(-50%,-50%) rotate(0deg);
    }
    .modal .modal-emoji {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 26px;
      background: #fffbeb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 78px;
      line-height: 1;
      user-select: none;
    }
    .modal .modal-word {
      font-size: 44px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .modal .modal-word .modal-pos {
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
      background: #f1f5f9;
      padding: 4px 18px;
      border-radius: 40px;
    }
    .modal .modal-th {
      font-size: 25px;
      font-weight: 600;
      color: #475569;
      margin-top: 4px;
    }
    .modal .modal-divider {
      height: 2px;
      background: #f1f5f9;
      margin: 20px 0 22px;
    }
    .modal .sentences-title {
      font-size: 16px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal .sentence-item {
      background: #f8fafc;
      padding: 14px 18px;
      border-radius: 18px;
      margin-bottom: 12px;
      border-left: 6px solid #f59e0b;
      font-size: 16px;
      line-height: 1.6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .modal .sentence-item .s-en { font-weight: 500; flex:1; }
    .modal .sentence-item .s-th { font-size: 15px; color: #64748b; margin-top: 2px; }
    .modal .sentence-item .speak-sentence-btn {
      background: #fef3c7;
      border: none;
      border-radius: 40px;
      padding: 8px 14px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #1e293b;
    }
    .modal .sentence-item .speak-sentence-btn:hover {
      background: #fcd34d;
      transform: scale(1.05);
    }
    .modal .modal-btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }
    .modal .modal-speak-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 30px;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      box-shadow: 0 8px 18px rgba(249, 115, 22, 0.3);
    }
    .modal .modal-speak-btn:hover {
      background: #ea580c;
      transform: scale(1.03);
    }
    .modal .modal-mic-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 30px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      box-shadow: 0 8px 18px rgba(239, 68, 68, 0.3);
    }
    .modal .modal-mic-btn:hover {
      background: #dc2626;
      transform: scale(1.03);
    }
    .modal .modal-mic-btn.listening {
      animation: micPulse 0.9s infinite;
      background: #b91c1c;
    }
    .modal .modal-mic-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .modal-mic-feedback {
      margin-top: 14px;
      font-size: 16px;
      font-weight: 600;
      min-height: 24px;
      color: #475569;
    }
    .modal-mic-feedback.good { color: #15803d; }
    .modal-mic-feedback.bad { color: #b45309; }
    .modal-mic-feedback.err { color: #b91c1c; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }
    .empty-state .big-icon { font-size: 64px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 24px; color: #475569; }

    .footer {
      text-align: center;
      padding: 30px 0 10px;
      font-size: 15px;
      color: #94a3b8;
    }

    @media (max-width:640px) {
      body { padding: 10px; }
      .header h1 { font-size: 30px; }
      .header p { font-size: 17px; }
      .header p.school-line { font-size: 16px; }
      .controls { flex-direction: column; align-items: stretch; }
      .controls .stats { margin-left: 0; text-align: center; }
      .vocab-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; }
      .card .en { font-size: 23px; }
      .card .th { font-size: 15px; }
      .card .card-emoji { font-size: 50px; }
      .modal .modal-top { gap: 16px; }
      .modal .modal-image-wrap { width: 90px; height: 90px; }
      .modal .modal-emoji { font-size: 54px; }
      .modal .modal-word { font-size: 30px; }
      .modal .modal-btn-row { flex-direction: column; }
      .modal .modal-speak-btn, .modal .modal-mic-btn { width: 100%; justify-content: center; }
    }
    @media (prefers-color-scheme:dark) {
      body { background: #0f172a; color: #e2e8f0; }

function getEmoji(word) {
  const w = (word || '').toLowerCase().trim();
  if (!w) return '📖';
  if (EMOJI_MAP[w]) return EMOJI_MAP[w];
  const first = w.split(/\s+/)[0];
  if (EMOJI_MAP[first]) return EMOJI_MAP[first];
  for (const key of Object.keys(EMOJI_MAP)) {
    if (w === key || w.includes(key)) return EMOJI_MAP[key];
  }
  return '📖';
}

function parseVocabData(raw) {
  const lines = raw.split('\n');
  const entries = [];
  let currentGrade = 'ทั้งหมด';

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    if (line.startsWith('## 📘') || line.startsWith('## 📗') ||
        line.startsWith('## 📙') || line.startsWith('## 📕') ||
        line.startsWith('## 📔') || line.startsWith('## 📓')) {
      const match = line.match(/ป\.\s*(\d+)/);
      if (match) currentGrade = `ป.${match[1]}`;
      continue;
    }
    if (line.startsWith('## 🎨') || line.startsWith('## 🔷') ||
        line.startsWith('## 📅') || line.startsWith('## 📆') ||
        line.startsWith('## 🔢') || line.startsWith('## 🏅')) {
      currentGrade = 'พิเศษ';
      continue;
    }

    const entryMatch = line.match(/^(\d+)\.\s+([^\–]+)\s*–\s*(.+)$/);
    if (entryMatch) {
      const word = entryMatch[2].trim();
      const enSentence = entryMatch[3].trim();

      let thSentence = '';
      let thMeaning = '';
      if (i + 1 < lines.length) {
        const nextLine = lines[i + 1].trim();
        const thMatch = nextLine.match(/^\*\*\s*(.+?)\s*–\s*(.+?)\s*\*\*$/) || nextLine.match(/^\*\*\s*(.+?)\s*–\s*(.+)$/);
        if (thMatch) {
          thMeaning = thMatch[1].trim();
          thSentence = thMatch[2].replace(/\*+$/, '').trim();
          i++;
        }
      }

      let pos = '';
      const posMatch = word.match(/\(([^)]+)\)/);
      if (posMatch) pos = posMatch[1].trim();

      const cleanWord = word.replace(/\([^)]*\)/g, '').trim() || word;

      entries.push({
        en: cleanWord,
        th: thMeaning || cleanWord,
        pos: pos,
        grade: currentGrade,
        sentenceEn: enSentence,
        sentenceTh: thSentence || thMeaning || cleanWord,
      });
    }
  }
  return entries;
}

// ============================================================
//  SPEECH SYNTHESIS
// ============================================================
let bestVoice = null;

function loadBestEnglishVoice() {
  if (!window.speechSynthesis) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  const preferred = [
    'Google US English',
    'Microsoft David',
    'Alex',
    'Samantha',
    'en-US', 'en-GB'
  ];

  for (const name of preferred) {
    const found = voices.find(v => v.name.includes(name) || v.lang.startsWith(name));
    if (found) {
      bestVoice = found;
      return;
    }
  }
  const anyEn = voices.find(v => v.lang.startsWith('en'));
  if (anyEn) bestVoice = anyEn;
}

if (window.speechSynthesis) {
  if (window.speechSynthesis.getVoices().length) {
    loadBestEnglishVoice();
  } else {
    window.speechSynthesis.onvoiceschanged = () => {
      loadBestEnglishVoice();
    };
  }
}

function speakEnglish(text) {
  if (!window.speechSynthesis) {
    alert('เบราว์เซอร์ไม่รองรับการสังเคราะห์เสียง');
    return;
  }
  window.speechSynthesis.cancel();
  if (!bestVoice) loadBestEnglishVoice();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = 0.8;
  utterance.pitch = 1.0;
  if (bestVoice) utterance.voice = bestVoice;

  if (!utterance.voice) {
    const voices = window.speechSynthesis.getVoices();
    const fallback = voices.find(v => v.lang.startsWith('en'));
    if (fallback) utterance.voice = fallback;
  }
  window.speechSynthesis.speak(utterance);
}

// ============================================================
//  PRONUNCIATION PRACTICE
// ============================================================
const SpeechRecCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let activeRecognition = null;
let isPracticing = false;

function normalizeWord(s) {
  return (s || '').toLowerCase().replace(/[^a-z]/g, '');
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = new Array(n + 1);
  for (let j = 0; j <= n; j++) dp[j] = j;
  for (let i = 1; i <= m; i++) {
    let prev = dp[0];
    dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const temp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
      prev = temp;
    }
  }
  return dp[n];
}

function similarity(a, b) {
  const longer = Math.max(a.length, b.length) || 1;
  return 1 - levenshtein(a, b) / longer;
}

function isGoodMatch(target, transcripts) {
  const t = normalizeWord(target);
  if (!t) return false;
  for (const alt of transcripts) {
    const s = normalizeWord(alt);
    if (!s) continue;
    if (s === t) return true;
    if (s.includes(t) || t.includes(s)) return true;
    if (similarity(t, s) >= 0.72) return true;
  }
  return false;
}

function practicePronunciation(word, callbacks) {
  callbacks = callbacks || {};
  if (isPracticing) return;
  if (!SpeechRecCtor) {
    callbacks.onError && callbacks.onError('unsupported');
    return;
  }

  let settled = false;
  isPracticing = true;

  const rec = new SpeechRecCtor();
  activeRecognition = rec;
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 5;
  rec.continuous = false;

  rec.onstart = () => { callbacks.onListening && callbacks.onListening(); };

  rec.onresult = (e) => {
    settled = true;
    const alts = [];
    const results = e.results && e.results[0];
    if (results) {
      for (let i = 0; i < results.length; i++) alts.push(results[i].transcript);
    }
    const good = isGoodMatch(word, alts);
    callbacks.onResult && callbacks.onResult(good, alts[0] || '');
  };

  rec.onerror = (e) => {
    settled = true;
    callbacks.onError && callbacks.onError(e.error || 'unknown');
  };

  rec.onend = () => {
    isPracticing = false;
    activeRecognition = null;
    if (!settled) {
      callbacks.onError && callbacks.onError('no-speech');
    }
    callbacks.onEnd && callbacks.onEnd();
  };

  try {
    rec.start();
  } catch (err) {
    isPracticing = false;
    activeRecognition = null;
    callbacks.onError && callbacks.onError('start-failed');
  }
}

function showStickerOverlay(container, big) {
  if (!container) return;
  const overlay = document.createElement('div');
  overlay.className = 'sticker-overlay';
  overlay.innerHTML = `
    <div class="sticker-pop${big ? ' big' : ''}">
      <span class="sticker-emoji">👍</span>
      <span class="sticker-text">ถูกใจ!</span>
    </div>
  `;
  container.appendChild(overlay);
  setTimeout(() => overlay.remove(), 1700);
}

function startPracticeOnCard(card, micIcon, word) {
  if (isPracticing) return;
  if (!SpeechRecCtor) {
    alert('ขออภัยครับ เบราว์เซอร์นี้ยังไม่รองรับการฟังเสียงพูด ลองเปิดด้วย Chrome บนคอมพิวเตอร์หรือมือถือดูนะครับ');
    return;
  }
  card.classList.add('mic-listening');

  practicePronunciation(word, {
    onListening() {},
    onResult(good) {
      card.classList.remove('mic-listening');
      if (good) {
        card.classList.add('mic-success');
        showStickerOverlay(card, false);
        setTimeout(() => card.classList.remove('mic-success'), 1000);
      } else {
        card.classList.add('mic-fail');
        setTimeout(() => card.classList.remove('mic-fail'), 500);
      }
    },
    onError(errCode) {
      card.classList.remove('mic-listening');
      card.classList.add('mic-fail');
      setTimeout(() => card.classList.remove('mic-fail'), 500);
      if (errCode === 'not-allowed' || errCode === 'service-not-allowed') {
        alert('กรุณาอนุญาตให้ใช้ไมโครโฟนก่อนนะครับ');
      }
    },
    onEnd() {}
  });
}

// ============================================================
//  APP STATE
// ============================================================
let allWords = [];
let filteredWords = [];
let currentGrade = 'ทั้งหมด';
let searchQuery = '';
let doubleTapTimer = null;
let isDoubleTap = false;

const grid = document.getElementById('vocabGrid');
const gradeSelect = document.getElementById('gradeSelect');
const gradeTabs = document.getElementById('gradeTabs');
const searchInput = document.getElementById('searchInput');
const totalCount = document.getElementById('totalCount');
const modalOverlay = document.getElementById('modalOverlay');
const modalCloseBtn = document.getElementById('modalCloseBtn');
const modalEn = document.getElementById('modalEn');
const modalPos = document.getElementById('modalPos');
const modalTh = document.getElementById('modalTh');
const modalEmoji = document.getElementById('modalEmoji');
const modalImageOuter = document.getElementById('modalImageOuter');
const modalSentences = document.getElementById('modalSentences');
const modalSpeakBtn = document.getElementById('modalSpeakBtn');
let currentModalWord = null;

// ============================================================
//  RENDER
// ============================================================
function render() {
  const grade = currentGrade;
  const query = searchQuery.trim().toLowerCase();

  let words = allWords;
  if (grade !== 'ทั้งหมด') {
    words = words.filter(w => w.grade === grade);
  }
  if (query) {
    words = words.filter(w =>
      w.en.toLowerCase().includes(query) ||
      w.th.toLowerCase().includes(query)
    );
  }

  filteredWords = words;
  totalCount.textContent = words.length;

  if (words.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="big-icon">📭</div>
        <h3>ไม่พบคำศัพท์</h3>
        <p>ลองเปลี่ยนระดับชั้น หรือค้นหาด้วยคำอื่น</p>
      </div>
    `;
    return;
  }

  let html = '';
  for (const w of words) {
    const posDisplay = w.pos || '';
    const emoji = getEmoji(w.en);
    html += `
      <div class="card" data-en="${w.en}" data-th="${w.th}" data-pos="${w.pos}" data-grade="${w.grade}" data-index="${allWords.indexOf(w)}">
        <div class="img-frame">
          <div class="card-emoji">${emoji}</div>
        </div>
        <span class="speak-icon">🔊</span>
        <span class="mic-icon" title="ลองพูดคำนี้">🎤</span>
        <div class="en">${w.en}</div>
        <div class="th">${w.th}</div>
        ${posDisplay ? `<span class="pos">${posDisplay}</span>` : ''}
      </div>
    `;
  }
  grid.innerHTML = html;

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', handleCardClick);
    card.addEventListener('dblclick', handleCardDoubleClick);

    const micIcon = card.querySelector('.mic-icon');
    if (micIcon) {
      micIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        const data = getWordData(card);
        startPracticeOnCard(card, micIcon, data.en);
      });
      micIcon.addEventListener('dblclick', (e) => e.stopPropagation());
      micIcon.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    }

    let lastTap = 0;
    card.addEventListener('touchstart', (e) => {
      const now = Date.now();
      const timeSince = now - lastTap;
      lastTap = now;
      if (timeSince < 400 && timeSince > 0) {
        e.preventDefault();
        handleCardDoubleClick(e);
      } else {
        if (doubleTapTimer) clearTimeout(doubleTapTimer);
        doubleTapTimer = setTimeout(() => {
          doubleTapTimer = null;
          if (!isDoubleTap) handleCardClick(e);
          isDoubleTap = false;
        }, 350);
      }
    }, { passive: true });
  });
}

function getWordData(card) {
  const idx = parseInt(card.dataset.index);
  return allWords[idx] || { en: card.dataset.en, th: card.dataset.th, pos: card.dataset.pos, grade: card.dataset.grade };
}

function handleCardClick(e) {
  const card = e.currentTarget;
  const data = getWordData(card);
  card.classList.add('speaking');
  setTimeout(() => card.classList.remove('speaking'), 800);
  speakEnglish(data.en);
}

function handleCardDoubleClick(e) {
  const card = e.currentTarget;
  const data = getWordData(card);
  if (doubleTapTimer) {
    clearTimeout(doubleTapTimer);
    doubleTapTimer = null;
  }
  isDoubleTap = true;
  showModal(data);
}

// ============================================================
//  MODAL
// ============================================================
function showModal(data) {
  currentModalWord = data;
  resetModalMicUI();

  modalEn.textContent = data.en;
  modalPos.textContent = data.pos || '';
  modalTh.textContent = data.th;
  modalEmoji.textContent = getEmoji(data.en);

  let html = '';
  if (data.sentenceEn) {
    html += `
      <div class="sentence-item">
        <div>
          <div class="s-en">${data.sentenceEn}</div>
          <div class="s-th">${data.sentenceTh || data.th}</div>
        </div>
        <button class="speak-sentence-btn" data-sentence="${data.sentenceEn}">🔊</button>
      </div>
    `;
  } else {
    html = `<p style="color:#94a3b8;">ไม่มีตัวอย่างประโยค</p>`;
  }
  modalSentences.innerHTML = html;

  document.querySelectorAll('.speak-sentence-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      speakEnglish(btn.dataset.sentence);
    });
  });

  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

modalCloseBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

modalSpeakBtn.addEventListener('click', () => {
  if (currentModalWord) speakEnglish(currentModalWord.en);
});

const modalMicBtn = document.getElementById('modalMicBtn');
const modalMicFeedback = document.getElementById('modalMicFeedback');

function resetModalMicButton() {
  if (modalMicBtn) {
    modalMicBtn.classList.remove('listening');
    modalMicBtn.disabled = false;
    modalMicBtn.innerHTML = '<span>🎤</span> ลองพูดคำนี้';
  }
}

function resetModalMicUI() {
  if (modalMicFeedback) {
    modalMicFeedback.textContent = '';
    modalMicFeedback.className = 'modal-mic-feedback';
  }
  resetModalMicButton();
}

modalMicBtn.addEventListener('click', () => {
  if (!currentModalWord || isPracticing) return;
  if (!SpeechRecCtor) {
    modalMicFeedback.textContent = '😅 เบราว์เซอร์นี้ยังไม่รองรับการฟังเสียงพูด ลองใช้ Chrome ดูนะครับ';
    modalMicFeedback.className = 'modal-mic-feedback err';
    return;
  }

  const word = currentModalWord.en;
  modalMicBtn.classList.add('listening');
  modalMicBtn.disabled = true;
  modalMicBtn.innerHTML = '<span>🎙️</span> กำลังฟัง...';
  modalMicFeedback.textContent = `พูดคำว่า "${word}" ได้เลยครับ`;
  modalMicFeedback.className = 'modal-mic-feedback';

  practicePronunciation(word, {
    onResult(good, heard) {
      if (good) {
        modalMicFeedback.textContent = '✅ เยี่ยมมาก! ออกเสียงถูกต้อง 🎉';
        modalMicFeedback.className = 'modal-mic-feedback good';
        showStickerOverlay(modalImageOuter, true);
      } else {
        modalMicFeedback.textContent = heard
          ? `🤔 เกือบแล้ว! ฉันได้ยินว่า "${heard}" ลองอีกครั้งนะ`
          : '🤔 ยังไม่ค่อยชัดเลย ลองอีกครั้งนะ';
        modalMicFeedback.className = 'modal-mic-feedback bad';
      }
    },
    onError(errCode) {
      if (errCode === 'not-allowed' || errCode === 'service-not-allowed') {
        modalMicFeedback.textContent = '🎙️ กรุณาอนุญาตให้ใช้ไมโครโฟนก่อนนะครับ';
      } else if (errCode === 'no-speech') {
        modalMicFeedback.textContent = '😶 ไม่ได้ยินเสียงเลย ลองพูดดังขึ้นอีกนิดนะ';
      } else {
        modalMicFeedback.textContent = '⚠️ เกิดข้อผิดพลาด ลองอีกครั้งนะครับ';
      }
      modalMicFeedback.className = 'modal-mic-feedback err';
    },
    onEnd() {
      resetModalMicButton();
    }
  });
});

// ============================================================
//  FILTER CONTROLS
// ============================================================
function populateGradeSelect() {
  const grades = ['ทั้งหมด'];
  const gradeSet = new Set();
  for (const w of allWords) {
    if (w.grade && !gradeSet.has(w.grade)) {
      gradeSet.add(w.grade);
      grades.push(w.grade);
    }
  }
  grades.sort((a, b) => {
    if (a === 'ทั้งหมด') return -1;
    if (b === 'ทั้งหมด') return 1;
    if (a === 'พิเศษ') return 1;
    if (b === 'พิเศษ') return -1;
    const na = parseInt(a.replace('ป.', ''));
    const nb = parseInt(b.replace('ป.', ''));
    return na - nb;
  });

  gradeSelect.innerHTML = '';
  for (const g of grades) {
    const opt = document.createElement('option');
    opt.value = g;
    let label = g;
    if (g === 'ทั้งหมด') label = '📚 ทั้งหมด';
    else if (g === 'พิเศษ') label = '🎨 พิเศษ';
    else label = `📖 ${g}`;
    opt.textContent = label;
    gradeSelect.appendChild(opt);
  }
  gradeSelect.value = currentGrade;

  gradeTabs.innerHTML = '';
  for (const g of grades) {
    const btn = document.createElement('button');
    let label = g;
    if (g === 'ทั้งหมด') label = '📚 ทั้งหมด';
    else if (g === 'พิเศษ') label = '🎨 พิเศษ';
    else label = `ป.${g.replace('ป.', '')}`;
    btn.textContent = label;
    btn.dataset.grade = g;
    if (g === currentGrade) btn.classList.add('active');
    btn.addEventListener('click', () => {
      currentGrade = g;
      gradeSelect.value = g;
      document.querySelectorAll('.grade-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
    gradeTabs.appendChild(btn);
  }
}

gradeSelect.addEventListener('change', (e) => {
  currentGrade = e.target.value;
  document.querySelectorAll('.grade-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.grade === currentGrade);
  });
  render();
});

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

// ============================================================
//  BACKGROUND FLOATERS
// ============================================================
function initBgFloaters() {
  const container = document.getElementById('bgFloaters');
  if (!container) return;
  const emojis = ['⭐', '✨', '🌟', '🎈', '🎉', '🦄', '🌈', '💫', '🍭', '🎨'];
  const count = 14;
  let html = '';
  for (let i = 0; i < count; i++) {
    const emoji = emojis[Math.floor(Math.random() * emojis.length)];
    const left = Math.random() * 100;
    const duration = 12 + Math.random() * 14;
    const delay = Math.random() * 18;
    const size = 16 + Math.random() * 18;
    html += `<span style="left:${left}%; font-size:${size}px; animation-duration:${duration}s; animation-delay:-${delay}s;">${emoji}</span>`;
  }
  container.innerHTML = html;
}

// ============================================================
//  INIT
// ============================================================
function init() {
  initBgFloaters();
  allWords = parseVocabData(VOCAB_DATA);
  const seen = new Set();
  const unique = [];
  for (const w of allWords) {
    const key = w.en + '|' + w.th;
    if (!seen.has(key)) {
      seen.add(key);
      unique.push(w);
    }
  }
  allWords = unique;

  populateGradeSelect();
  render();
  console.log(`✅ โหลดคำศัพท์ ${allWords.length} คำ`);

  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    setTimeout(loadBestEnglishVoice, 500);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
